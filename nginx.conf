events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 120;
    keepalive_requests 1000;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/rss+xml application/atom+xml image/svg+xml;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=frame_limit:10m rate=50r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Upstream backend
    upstream api_backend {
        ip_hash;
        server backend:8000;
    }

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # ==================================================================
        # Security Headers
        # ==================================================================
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

        # ==================================================================
        # API proxy
        # ==================================================================
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_conn conn_limit 10;

            proxy_pass http://api_backend/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

            # WebSocket support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeouts for long-running operations (segmentation)
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            # Large file upload support (DICOM)
            client_max_body_size 500M;
        }

        # Frame requests (higher rate limit for smooth playback)
        location /api/dicom/frame/ {
            limit_req zone=frame_limit burst=60 nodelay;
            limit_conn conn_limit 20;

            proxy_pass http://api_backend/dicom/frame/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        }

        # Health check (no rate limit)
        location /api/health {
            proxy_pass http://api_backend/health;
            proxy_http_version 1.1;
        }

        # ==================================================================
        # Static files
        # ==================================================================

        # SPA fallback
        # sub_filter appends ?cf=1 to .css URLs to bypass Cloudflare Tunnel
        # blocking bare .css extension requests with 502
        location / {
            sub_filter '.css"' '.css?cf=1"';
            sub_filter ".css'" ".css?cf=1'";
            sub_filter_types text/html;
            sub_filter_once off;
            try_files $uri $uri/ /index.html;
        }

        # Cache static assets (CSS served with query string to bypass CF tunnel)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;
        }


        # Block access to sensitive files
        location ~ /\. {
            deny all;
            return 404;
        }

        location ~* (\.env|\.git|\.htaccess|package(-lock)?\.json|yarn\.lock) {
            deny all;
            return 404;
        }
    }
}
